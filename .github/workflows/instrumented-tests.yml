name: Instrumented Tests (Espresso/Robolectric)

# Emulator-based CI for connectedAndroidTest — resolves the integration/e2e gap left by
# retiring the tester agent (BusyBuddy_v2#285): the dev-ticket pipeline's own test_command
# only runs ./gradlew test (JVM unit tests), and there was no CI path running instrumented
# tests at all before this. Deliberately a separate, repo-local workflow rather than a
# change to dev-pipeline-reusable.yml — that file lives in HeyItsChloe/pipeline-orchestrator,
# out of reach from this session, and this mirrors how BusyBuddy_v2's own e2e job
# (ci.yml's storefront-e2e) already runs as a standalone PR-triggered job, not through the
# dev-ticket pipeline either.
#
# NOTE: app/src/androidTest currently has exactly one file — the default Android Studio
# boilerplate (ExampleInstrumentedTest.kt, asserts the package name). This workflow
# provides the harness; it doesn't create test coverage that doesn't exist yet. Writing
# real Espresso/Robolectric tests for actual app flows is separate follow-up work.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_video:
        description: 'Capture screen recording of the emulator during the test run'
        type: boolean
        default: false

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            if [ "${{ inputs.record_video }}" = "true" ]; then
              adb shell screenrecord --time-limit 1800 /sdcard/instrumented-test-run.mp4 &
              RECORDER_PID=$!
            fi

            ./gradlew connectedDebugAndroidTest
            TEST_EXIT=$?

            if [ "${{ inputs.record_video }}" = "true" ]; then
              kill -INT "$RECORDER_PID" 2>/dev/null || true
              sleep 2
              adb pull /sdcard/instrumented-test-run.mp4 ./instrumented-test-run.mp4 || true
            fi

            exit $TEST_EXIT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**

      - name: Upload screen recording
        if: always() && inputs.record_video == true
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-recording
          path: instrumented-test-run.mp4
          if-no-files-found: ignore

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ job.status }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const status = passed ? 'PASSED' : 'FAILED';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `## ${icon} Instrumented Tests — ${status}`,
                '',
                `See the [CI run](${runUrl}) for details.`,
                '',
                `> Runs \`connectedDebugAndroidTest\` on an emulator (API 30). Coverage today is limited to the default Android Studio boilerplate test — no real Espresso/Robolectric flow tests exist yet.`,
              ].join('\n'),
            });
