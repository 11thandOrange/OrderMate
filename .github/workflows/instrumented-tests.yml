# Thin caller for the shared e2e pipeline (BusyBuddy_v2#285 Phase 6).
#
# app/src/androidTest has real Espresso coverage (MainActivityNavigationTest.kt,
# OrderListFlowTest.kt) for the side-nav and default order-list flows, tracked
# against app/e2e-coverage.yaml via coverage_manifest_path below. Not yet
# covered: checkout, settings, calendar flows - separate follow-up work.

name: Instrumented Tests (Espresso/Robolectric)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_video:
        description: 'Capture screen recording of the emulator during the test run'
        type: boolean
        default: false

jobs:
  espresso:
    permissions:
      contents: read
      pull-requests: write
    uses: 11thandOrange/agent-ops/.github/workflows/e2e-pipeline-reusable.yml@main
    with:
      working_directory: app
      # gradlew lives at the repo root, one level above working_directory -
      # confirmed on a real CI run that "./gradlew" 404s here since the
      # shell's cwd is app/, not the repo root.
      test_command: "../gradlew connectedDebugAndroidTest"
      needs_emulator: true
      emulator_api_level: 30
      record_video: ${{ inputs.record_video || false }}
      coverage_manifest_path: e2e-coverage.yaml
