name: List subscribers

# Manual only - reads the Realtime Database and prints merchants grouped by
# subscription status into the run log.
on:
  workflow_dispatch:
  # Manual dispatch only works for workflows on the default branch, so the
  # branch push doubles as the trigger while this lives on a feature branch.
  push:
    branches:
      - claude/vigilant-dirac-gfurdl
    paths:
      - .github/workflows/list-subscribers.yml
      - .github/scripts/list-subscribers.js

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install firebase-admin
        run: npm install --no-save firebase-admin@^12.0.0

      - name: List subscribers
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node .github/scripts/list-subscribers.js
