# wiki.config.yaml - per-repo configuration for the shared wiki generator
# (agent-ops issue #286). Read by agent-ops's scripts/wiki-generate.mjs via
# the thin caller at .github/workflows/wiki-generate.yml.
#
# Every path/glob below was verified against this repo's real tree before
# being written (not copied blind from agent-ops's
# templates/wiki-site/wiki.config.example.yaml) - see that file's own
# header comment for the general field reference.

site:
  title: "OrderMate Docs"
  description: "API reference, guides, and features for Clover POS order management."
  # Matches docs/frontend/src/index.css's --color-brand/--color-brand-hover
  # from the old hand-built site.
  theme:
    accent: "#FF9F43"
    accentHover: "#e68a2e"
    accentMuted: "rgba(255, 159, 67, 0.1)"
  favicon: "/favicon.svg"
  githubUrl: "https://github.com/11thandOrange/OrderMate"
  # Matches docs/CNAME's existing value - this domain is already live.
  customDomain: "ordermate.dev"

# No wiki-backend instance (templates/wiki-backend) is deployed yet for
# this new generated site, so the Sandbox ("Try it") panel has nothing to
# proxy through until one is. Left as placeholders rather than guessed real
# values. Note: docs/backend (a hand-built FastAPI proxy predating the
# shared template - see templates/wiki-backend/README.md's own comparison)
# is intentionally left in place and undeleted; it's out of scope for this
# site regeneration and may still be serving the old frontend's sandbox.
backend:
  proxyBaseUrl: "https://ordermate-wiki-backend.example.com"
  targetApiBaseUrl: "https://api.clover.com"

extractors:
  endpointsExpress:
    enabled: false

  # OrderMate's real Retrofit interface (MessageBird conversations API) -
  # confirmed the only file in this package matching @GET/@POST/interface
  # patterns. Most of the app's real "API surface" is the Clover Android
  # SDK (AIDL/in-process, not a REST API), so this section is intentionally
  # small - that's accurate to the app's real shape, not an extractor gap.
  endpointsKotlin:
    enabled: true
    interfaceGlob:
      - "app/src/main/java/com/orderMate/networkManager/*.kt"

  workflows:
    enabled: true
    glob:
      - ".github/workflows/*.yml"

  automation:
    enabled: true
    pipelinesYamlPath: "orchestrator/src/registry/pipelines.yaml"
    repoMatch: "11thandOrange/OrderMate"

  tests:
    enabled: true
    suites:
      - name: "Instrumented UI tests (Espresso)"
        framework: espresso
        glob: "app/src/androidTest/**/*.kt"

  markdown:
    enabled: true
    sources:
      - glob: "CHANGELOG.md"
        navSection: "Changelog"

  appList:
    enabled: false

  # Third parties that live in no manifest - authored here (approach A) and
  # rendered on the Dependencies & Integrations page. Slugs are referenced by
  # feature docs' implements.integrations. Every field is a literal.
  integrations:
    enabled: true
    items:
      - slug: clover-android-sdk
        name: "Clover Android SDK"
        kind: sdk
        summary: "The app's primary data surface: orders, merchants, and connectors come from the Clover SDK in-process (AIDL), not a REST API."
        auth: "Clover app connection (connect the app from the App Market preview)"
        url: "https://docs.clover.com/docs/using-the-android-sdk"
        notes:
          - kind: important
            body: "You must connect the app from the App Market preview before any Clover data is available - see README.md."
      - slug: messagebird-conversations
        name: "MessageBird Conversations API"
        kind: api
        summary: "The app's only REST interface (Retrofit) - sends order emails/SMS and reads customer conversations by order."
        auth: "Bearer token (Retrofit auth instance)"
        url: "https://developers.messagebird.com/api/conversations/"
        notes:
          - kind: note
            body: "Defined in app/src/main/java/com/orderMate/networkManager/ApiCall.kt; this is the surface the Kotlin endpoints extractor documents."
      - slug: openhands-cloud
        name: "OpenHands Cloud"
        kind: service
        summary: "Autonomous-dev and complex-logic automations that pick up GitHub issues for this repo and open pull requests."
        auth: "API key (OPENHANDS_API_KEY)"
        url: "https://app.all-hands.dev/"
        notes:
          - kind: note
            body: "Triggered via the shared Postman collection; the same collection covers BusyBuddy_v2 and Orbit."
      - slug: pipeline-orchestrator
        name: "Pipeline Orchestrator (agent-ops)"
        kind: service
        summary: "The agent-ops control repo whose pipelines.yaml registers this repo's automation entry and whose shared workflow generates this docs site."
        auth: "GitHub App / repo secrets (secrets: inherit)"
        url: "https://github.com/11thandOrange/agent-ops"
        notes:
          - kind: note
            body: "The Automation page is generated from this repo's entry in agent-ops's orchestrator/src/registry/pipelines.yaml."

  # Authored (not derived) - drafted via wiki-author.mjs from
  # wiki-content/authoring.yaml when author_content: true is set on the
  # caller, then read verbatim from docs/src/content/features/*.md here.
  features:
    enabled: true

output:
  dataDir: "src/data"
  contentDir: "src/content"
